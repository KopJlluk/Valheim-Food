    <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valheim Food Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-7xl mx-auto">
    <!-- Шапка -->
    <header class="text-center mb-6">
      <h1 class="text-3xl md:text-5xl font-bold text-amber-500 tracking-wide uppercase">
        🍺 Valheim Food Calculator
      </h1>
      <p class="text-slate-400 text-sm md:text-base mt-2">Калькулятор сложных блюд, зелий и пиров</p>
    </header>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ: ПОИСК И КАТЕГОРИИ -->
    <div class="bg-slate-800 border border-slate-700/80 rounded-xl p-4 shadow-lg mb-6 space-y-4">
      <div>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="🔍 Поиск по ингредиенту или названию..." 
          class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-amber-500 transition shadow-inner"
        >
      </div>

      <div class="flex flex-wrap gap-2 pt-1 border-t border-slate-700/60" id="categoryFilters">
        <button data-cat="all" class="cat-btn px-4 py-2 rounded-lg text-sm font-bold bg-amber-500 text-slate-950 transition">
          🌐 Всё
        </button>
        <button data-cat="food" class="cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-900/60 hover:bg-slate-700 text-slate-200 transition">
          🥩 Еда
        </button>
        <button data-cat="mead" class="cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-900/60 hover:bg-slate-700 text-slate-200 transition">
          🧪 Медовухи
        </button>
        <button data-cat="feast" class="cat-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-900/60 hover:bg-slate-700 text-slate-200 transition">
          🍖 Пиры
        </button>
      </div>
    </div>

    <!-- Главный контейнер -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

      <!-- ЛЕВАЯ ПАНЕЛЬ -->
      <aside class="lg:col-span-1 space-y-6">
        
        <!-- КОРЗИНА ФАРМА -->
        <div id="summaryContainer"></div>

        <!-- Статы -->
        <div class="bg-slate-800 border border-slate-700/80 rounded-xl p-4 shadow-lg">
          <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wider mb-3">Статы и Характеристики</h2>
          <div class="space-y-1.5" id="statTypeFilters">
            <button data-stat="all" class="stat-btn w-full text-left px-3 py-2 rounded-lg text-sm font-bold bg-amber-500 text-slate-950 transition">
              🌟 Все статы
            </button>
            <button data-stat="hp" class="stat-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium bg-slate-900/60 hover:bg-slate-700 text-slate-200 transition">
              ❤️ Здоровье (HP)
            </button>
            <button data-stat="stamina" class="stat-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium bg-slate-900/60 hover:bg-slate-700 text-slate-200 transition">
              ⚡ Выносливость (Stamina)
            </button>
            <button data-stat="eitr" class="stat-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium bg-slate-900/60 hover:bg-slate-700 text-slate-200 transition">
              ✨ Эйтир (Eitr)
            </button>
            <button data-stat="balanced" class="stat-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium bg-slate-900/60 hover:bg-slate-700 text-slate-200 transition">
              ⚖️ Баланс (HP + Stamina)
            </button>
          </div>
        </div>

        <!-- Биомы -->
        <div class="bg-slate-800 border border-slate-700/80 rounded-xl p-4 shadow-lg">
          <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-700">
            <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider">Биомы</h2>
            <button 
              type="button" 
              id="resetBiomesBtn"
              class="text-xs text-amber-400 hover:text-amber-300 font-medium transition"
            >
              Сброс
            </button>
          </div>

          <div class="space-y-2" id="biomeCheckboxes">
            <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-lg cursor-pointer hover:bg-slate-700/50 transition">
              <input type="checkbox" value="blackforest" checked class="biome-checkbox accent-amber-500 w-4 h-4 rounded">
              <span class="text-xs text-slate-200">🌲 Чёрный Лес</span>
            </label>
            <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-lg cursor-pointer hover:bg-slate-700/50 transition">
              <input type="checkbox" value="swamp" checked class="biome-checkbox accent-amber-500 w-4 h-4 rounded">
              <span class="text-xs text-slate-200">☣️ Болота</span>
            </label>
            <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-lg cursor-pointer hover:bg-slate-700/50 transition">
              <input type="checkbox" value="ocean" checked class="biome-checkbox accent-amber-500 w-4 h-4 rounded">
              <span class="text-xs text-slate-200">🌊 Океан</span>
            </label>
            <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-lg cursor-pointer hover:bg-slate-700/50 transition">
              <input type="checkbox" value="mountain" checked class="biome-checkbox accent-amber-500 w-4 h-4 rounded">
              <span class="text-xs text-slate-200">❄️ Горы</span>
            </label>
            <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-lg cursor-pointer hover:bg-slate-700/50 transition">
              <input type="checkbox" value="plains" checked class="biome-checkbox accent-amber-500 w-4 h-4 rounded">
              <span class="text-xs text-slate-200">🌾 Равнины</span>
            </label>
            <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-lg cursor-pointer hover:bg-slate-700/50 transition">
              <input type="checkbox" value="mistlands" checked class="biome-checkbox accent-amber-500 w-4 h-4 rounded">
              <span class="text-xs text-slate-200">🌫️ Туманные земли</span>
            </label>
          </div>
        </div>

      </aside>

      <!-- СПИСОК РЕЦЕПТОВ -->
      <main class="lg:col-span-3">
        <div id="recipesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <!-- Динамически заполняется через app.js -->
        </div>
      </main>

    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
